# Production stack for AWS EC2 + Podman.
# Do not publish Postgres/Redis. Only Caddy exposes 80/443.
services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-udharwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-udharwise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-udharwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-udharwise}
      REDIS_URL: redis://redis:6379/0
      ACTIVE_JOB_ADAPTER: ${ACTIVE_JOB_ADAPTER:-async}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3000"
    restart: unless-stopped
    command:
      [
        "bash",
        "-c",
        "bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000",
      ]

  sidekiq:
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-udharwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-udharwise}
      REDIS_URL: redis://redis:6379/0
      ACTIVE_JOB_ADAPTER: sidekiq
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    profiles:
      - sidekiq
    command: ["bundle", "exec", "sidekiq"]

  caddy:
    image: docker.io/library/caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env e.g. api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
