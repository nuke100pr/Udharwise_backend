default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: app_development
  url: <%= ENV.fetch("DATABASE_URL", nil) %>

test:
  <<: *default
  database: app_test

# primary + aliases so Solid* gems (if present) can resolve :cache / :cable / :queue
production:
  primary: &production_primary
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") %>
  cache:
    <<: *production_primary
    migrations_paths: db/cache_migrate
  queue:
    <<: *production_primary
    migrations_paths: db/queue_migrate
  cable:
    <<: *production_primary
    migrations_paths: db/cable_migrate
